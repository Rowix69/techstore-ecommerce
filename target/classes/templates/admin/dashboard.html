<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #f6f1e9;
            --dark: #241812;
            --dark-2: #2f2019;
            --accent: #c0392b;
            --accent-dark: #a5281a;
            --accent-soft: rgba(192, 57, 43, 0.12);
            --gold: #c98a4b;
            --ink: #2b211c;
            --muted: #8a7b6f;
            --line: #e7ddcf;
            --green: #3f8b52;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--ink);
        }

        h1, h2, h3, h4, h5, .font-serif {
            font-family: 'Playfair Display', 'Segoe UI', serif;
        }

        a { text-decoration: none; }

        /* ===== NAVBAR ===== */
        .navbar-restaurante {
            background-color: var(--dark);
            padding: 14px 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
        }

        .navbar-restaurante .navbar-brand {
            color: #fff !important;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-restaurante .brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
        }

        .navbar-restaurante .navbar-nav {
            gap: 6px;
        }

        .navbar-restaurante .nav-link {
            color: rgba(255,255,255,0.65) !important;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 14px !important;
            border-radius: 999px;
            transition: all .2s;
        }

        .navbar-restaurante .nav-link:hover {
            color: #fff !important;
            background: rgba(255,255,255,0.08);
        }

        .navbar-restaurante .nav-link.fw-bold {
            color: #fff !important;
            background: rgba(255,255,255,0.12);
        }

        .nav-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 999px;
            background: var(--gold);
            color: var(--dark);
            font-size: 0.68rem;
            font-weight: 800;
            margin-left: 4px;
            vertical-align: 2px;
        }

        .navbar-restaurante .btn-logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.85);
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 16px;
            transition: all .2s;
        }

        .navbar-restaurante .btn-logout:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-restaurante px-3 mb-4">
    <a class="navbar-brand" href="#">
        <span class="brand-badge"><i class="fas fa-utensils"></i></span>
        Restaurante
    </a>


    <div class="navbar-nav">
        <a class="nav-link fw-bold" href="/admin/dashboard">Panel</a>
        <a class="nav-link" href="/admin/mesas">Mesas</a>
        <a class="nav-link" href="/admin/platos">Carta</a>
        <a class="nav-link" href="/admin/reservas">Reservas</a>
    </div>
    <form action="/logout" method="post" class="ms-auto">
        <button class="btn-logout" type="submit"><i class="fas fa-arrow-right-from-bracket me-1"></i> Cerrar sesión</button>
    </form>
</nav>

<div class="container">
    <h3>Bienvenido, <span>Administrador</span></h3>
    <div class="row g-3 mt-3">
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2>9</h2>
                <p>Mesas registradas</p>
                <a href="/admin/mesas" class="btn btn-outline-danger btn-sm">Gestionar mesas</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2>13</h2>
                <p>Reservas totales</p>
                <a href="/admin/reservas" class="btn btn-outline-danger btn-sm">Ver reservas</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h2>🍽️</h2>
                <p>Carta del restaurante</p>
                <a href="/admin/platos" class="btn btn-outline-danger btn-sm">Gestionar carta</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
