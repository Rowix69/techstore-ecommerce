<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Mesas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #f6f1e9;
            --dark: #241812;
            --dark-2: #2f2019;
            --accent: #c0392b;
            --accent-dark: #a5281a;
            --accent-soft: rgba(192, 57, 43, 0.12);
            --gold: #c98a4b;
            --ink: #2b211c;
            --muted: #8a7b6f;
            --line: #e7ddcf;
            --green: #3f8b52;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--ink);
        }

        h1, h2, h3, h4, h5, .font-serif {
            font-family: 'Playfair Display', 'Segoe UI', serif;
        }

        a { text-decoration: none; }

        /* ===== NAVBAR ===== */
        .navbar-restaurante {
            background-color: var(--dark);
            padding: 14px 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
        }

        .navbar-restaurante .navbar-brand {
            color: #fff !important;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-restaurante .brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
        }

        .navbar-restaurante .navbar-nav {
            gap: 6px;
        }

        .navbar-restaurante .nav-link {
            color: rgba(255,255,255,0.65) !important;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 14px !important;
            border-radius: 999px;
            transition: all .2s;
        }

        .navbar-restaurante .nav-link:hover {
            color: #fff !important;
            background: rgba(255,255,255,0.08);
        }

        .navbar-restaurante .nav-link.fw-bold {
            color: #fff !important;
            background: rgba(255,255,255,0.12);
        }

        .nav-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 999px;
            background: var(--gold);
            color: var(--dark);
            font-size: 0.68rem;
            font-weight: 800;
            margin-left: 4px;
            vertical-align: 2px;
        }

        .navbar-restaurante .btn-logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.85);
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 16px;
            transition: all .2s;
        }

        .navbar-restaurante .btn-logout:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('mesas')}"></div>

<div class="container">
    <h3>Mesas</h3>

    <form th:action="@{/admin/mesas}" method="post" class="row g-2 mb-4">
        <div class="col-auto">
            <input type="number" name="numero" class="form-control" placeholder="N° de mesa" required>
        </div>
        <div class="col-auto">
            <input type="number" name="capacidad" class="form-control" placeholder="Capacidad" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-danger">Agregar mesa</button>
        </div>
    </form>

    <table class="table table-bordered bg-white">
        <thead>
        <tr><th>N°</th><th>Capacidad</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="mesa : ${mesas}">
            <td th:text="${mesa.numero}"></td>
            <td th:text="${mesa.capacidad}"></td>
            <td th:text="${mesa.estado}"></td>
            <td>
                <form th:action="@{/admin/mesas/eliminar/{id}(id=${mesa.id})}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar mesa?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
