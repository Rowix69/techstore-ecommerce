<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #f6f1e9;
            --dark: #241812;
            --dark-2: #2f2019;
            --accent: #c0392b;
            --accent-dark: #a5281a;
            --accent-soft: rgba(192, 57, 43, 0.12);
            --gold: #c98a4b;
            --ink: #2b211c;
            --muted: #8a7b6f;
            --line: #e7ddcf;
            --green: #3f8b52;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--ink);
        }

        h1, h2, h3, h4, h5, .font-serif {
            font-family: 'Playfair Display', 'Segoe UI', serif;
        }

        a { text-decoration: none; }

        /* ===== NAVBAR ===== */
        .navbar-restaurante {
            background-color: var(--dark);
            padding: 14px 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
        }

        .navbar-restaurante .navbar-brand {
            color: #fff !important;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-restaurante .brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
        }

        .navbar-restaurante .navbar-nav {
            gap: 6px;
        }

        .navbar-restaurante .nav-link {
            color: rgba(255,255,255,0.65) !important;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 14px !important;
            border-radius: 999px;
            transition: all .2s;
        }

        .navbar-restaurante .nav-link:hover {
            color: #fff !important;
            background: rgba(255,255,255,0.08);
        }

        .navbar-restaurante .nav-link.fw-bold {
            color: #fff !important;
            background: rgba(255,255,255,0.12);
        }

        .nav-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 999px;
            background: var(--gold);
            color: var(--dark);
            font-size: 0.68rem;
            font-weight: 800;
            margin-left: 4px;
            vertical-align: 2px;
        }

        .navbar-restaurante .btn-logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.85);
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 16px;
            transition: all .2s;
        }

        .navbar-restaurante .btn-logout:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        /* ===== PAGE HEADER (carta / mi reserva) ===== */
        .page-header {
            margin-bottom: 26px;
        }

        .page-header .eyebrow {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .page-header h2 {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .page-header p { color: var(--muted); margin: 0; }

        .btn-back {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .btn-back:hover { color: var(--accent); }

        .container-narrow { max-width: 1140px; margin: 0 auto; padding: 0 16px; }

        /* ===== PERFIL ===== */
        .profile-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 30px 32px;
            max-width: 620px;
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .profile-head {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--line);
        }

        .profile-head h3 { margin: 0 0 6px; font-weight: 700; }

        .badge-frecuente {
            display: inline-flex;
            align-items: center;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .btn-editar-perfil {
            background: transparent;
            border: 1.5px solid var(--line);
            color: var(--ink);
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 999px;
            padding: 8px 18px;
            transition: all .2s;
            white-space: nowrap;
        }
        .btn-editar-perfil:hover { border-color: var(--gold); background: var(--bg); }

        .profile-section-label {
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .profile-row-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--bg);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        .profile-field label {
            color: var(--muted);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 4px;
            display: block;
        }

        .profile-field .form-control {
            border-radius: 10px;
            border: 1.5px solid var(--line);
            padding: 8px 12px;
            font-weight: 600;
        }

        .profile-field .form-control:focus {
            border-color: var(--gold);
            box-shadow: none;
        }

        .profile-field .form-control:disabled {
            background: transparent;
            color: var(--ink);
            opacity: 1;
            border-color: transparent;
            padding-left: 0;
        }

        .btn-guardar-perfil {
            background: var(--dark);
            color: #fff;
            font-weight: 700;
            border-radius: 12px;
            padding: 11px 26px;
            border: none;
            transition: all .2s;
            display: inline-flex;
            align-items: center;
        }
        .btn-guardar-perfil:hover { background: var(--accent); color: #fff; }
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('perfil')}"></div>

<div class="container container-narrow">

    <div class="page-header">
        <div class="eyebrow">Cuenta</div>
        <h2>Mi perfil</h2>
    </div>

    <div th:if="${guardado}" class="alert alert-success rounded-3">Tus datos se guardaron correctamente.</div>

    <div class="profile-card">
        <div class="profile-head">
            <div class="profile-avatar" th:text="${#strings.substring(usuario.nombre, 0, 1)}"></div>
            <div class="flex-grow-1">
                <h3 th:text="${usuario.nombre}"></h3>
                <span class="badge-frecuente"><i class="fas fa-star me-1"></i>Cliente</span>
            </div>
            <button type="button" id="btnEditar" class="btn-editar-perfil"><i class="fas fa-pen me-1"></i> Editar</button>
        </div>

        <form th:action="@{/cliente/perfil}" method="post" id="formPerfil">
            <div class="profile-section-label">Información personal</div>

            <div class="profile-row">
                <i class="fas fa-user profile-row-icon"></i>
                <div class="profile-field flex-grow-1">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre"
                           th:value="${usuario.nombre}" required disabled>
                </div>
            </div>

            <div class="profile-row">
                <i class="fas fa-id-card profile-row-icon"></i>
                <div class="profile-field flex-grow-1">
                    <label for="dni">DNI</label>
                    <input type="text" class="form-control" id="dni" th:value="${usuario.dni}" disabled>
                </div>
            </div>

            <div class="profile-row">
                <i class="fas fa-mobile-screen profile-row-icon"></i>
                <div class="profile-field flex-grow-1">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono"
                           th:value="${usuario.telefono}" placeholder="+51 999 999 999" disabled>
                </div>
            </div>

            <button type="submit" id="btnGuardar" class="btn-guardar-perfil mt-3" style="display:none;">
                <i class="fas fa-check me-1"></i> Guardar cambios
            </button>
        </form>
    </div>

</div>

<script>
    const btnEditar = document.getElementById('btnEditar');
    const btnGuardar = document.getElementById('btnGuardar');
    const campos = document.querySelectorAll('#formPerfil #nombre, #formPerfil #telefono');

    btnEditar.addEventListener('click', function () {
        campos.forEach(function (c) { c.disabled = false; });
        document.getElementById('nombre').focus();
        btnGuardar.style.display = 'inline-flex';
        btnEditar.style.display = 'none';
    });
</script>
</body>
</html>
