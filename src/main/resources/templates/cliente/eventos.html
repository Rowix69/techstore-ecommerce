<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #f6f1e9;
            --dark: #241812;
            --dark-2: #2f2019;
            --accent: #c0392b;
            --accent-dark: #a5281a;
            --accent-soft: rgba(192, 57, 43, 0.12);
            --gold: #c98a4b;
            --ink: #2b211c;
            --muted: #8a7b6f;
            --line: #e7ddcf;
            --green: #3f8b52;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--ink);
        }

        h1, h2, h3, h4, h5, .font-serif {
            font-family: 'Playfair Display', 'Segoe UI', serif;
        }

        a { text-decoration: none; }

        /* ===== NAVBAR ===== */
        .navbar-restaurante {
            background-color: var(--dark);
            padding: 14px 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
        }

        .navbar-restaurante .navbar-brand {
            color: #fff !important;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-restaurante .brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
        }

        .navbar-restaurante .navbar-nav {
            gap: 6px;
        }

        .navbar-restaurante .nav-link {
            color: rgba(255,255,255,0.65) !important;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 14px !important;
            border-radius: 999px;
            transition: all .2s;
        }

        .navbar-restaurante .nav-link:hover {
            color: #fff !important;
            background: rgba(255,255,255,0.08);
        }

        .navbar-restaurante .nav-link.fw-bold {
            color: #fff !important;
            background: rgba(255,255,255,0.12);
        }

        .nav-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 999px;
            background: var(--gold);
            color: var(--dark);
            font-size: 0.68rem;
            font-weight: 800;
            margin-left: 4px;
            vertical-align: 2px;
        }

        .navbar-restaurante .btn-logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.85);
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 16px;
            transition: all .2s;
        }

        .navbar-restaurante .btn-logout:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        /* ===== PAGE HEADER (carta / mi reserva) ===== */
        .page-header {
            margin-bottom: 26px;
        }

        .page-header .eyebrow {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .page-header h2 {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .page-header p { color: var(--muted); margin: 0; }

        .btn-back {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .btn-back:hover { color: var(--accent); }

        .container-narrow { max-width: 1140px; margin: 0 auto; padding: 0 16px; }

        .empty-state {
            text-align: center;
            background: #fff;
            border: 1px dashed var(--line);
            border-radius: 20px;
            padding: 60px 30px;
            max-width: 520px;
        }

        .empty-state .icon-wrap {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            font-size: 1.5rem;
        }

        .empty-state h5 { font-weight: 700; margin-bottom: 8px; }
        .empty-state p { color: var(--muted); margin-bottom: 20px; }

        .btn-explore {
            background: var(--dark);
            color: #fff;
            border-radius: 999px;
            padding: 10px 26px;
            font-weight: 700;
            display: inline-block;
        }
        .btn-explore:hover { background: var(--accent); color: #fff; }
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('eventos')}"></div>

<div class="container container-narrow">
    <div class="page-header">
        <div class="eyebrow">Experiencias</div>
        <h2>Eventos</h2>
    </div>

    <div class="empty-state">
        <div class="icon-wrap"><i class="fas fa-calendar-star"></i></div>
        <h5>Muy pronto</h5>
        <p>Estamos preparando catas, cenas maridaje y experiencias especiales. Vuelve pronto para reservar tu lugar.</p>
        <a th:href="@{/cliente/mesas}" class="btn-explore">Reservar una mesa</a>
    </div>
</div>
</body>
</html>
